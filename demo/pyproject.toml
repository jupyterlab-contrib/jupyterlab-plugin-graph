[project]
name = "jupyterlab-plugin-graph-demo"
version = "0.1.0"
description = "JupyterLite demo for jupyterlab-plugin-graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.6.0",
    "jupyterlab-plugin-graph",
    "jupyterlite-core>=0.8.0,<0.9",
    "jupyterlite-pyodide-kernel>=0.8.0,<0.9",
]

[tool.uv.sources]
jupyterlab-plugin-graph = { path = ".." }
